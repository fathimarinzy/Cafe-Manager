# --- Toolchain --------------------------------------------------------------
# Pin the JDK to 17. Without this, gradlew uses JAVA_HOME while the IDE picks
# Android Studio's bundled JBR (21) -- and under JDK 21 the Flutter Gradle
# plugin included from flutter_tools/gradle fails at :gradle:compileGroovy,
# which surfaces during IDE sync as:
#   Could not create task ':generateLockfiles'
# JDK 17 compiles it cleanly and satisfies AGP 8.7's JDK 17+ requirement.
# Pinning also stops each launcher from forking its own daemon, since Gradle
# keys daemons by JDK. Forward slashes: a backslash is an escape character here.
org.gradle.java.home=C:/Program Files/Java/jdk-17.0.2

# --- JVM memory -------------------------------------------------------------
# Sized for a 16 GB machine running an IDE alongside the build.
# Observed peak Gradle heap for this project is ~1.8 GB, so 4 GB is generous
# headroom (R8 on release builds is the hungriest consumer).
# Do NOT raise -Xmx past ~4G here: on Windows the JVM reserves this against the
# system commit charge, and over-reserving is what crashed the daemon before.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# The Kotlin compile daemon is a SEPARATE JVM. Without this line it silently
# inherits org.gradle.jvmargs above, doubling the reservation.
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m

# This box has 12 cores; uncapped, Gradle forks up to 12 worker processes for
# dexing/merging and exhausts memory before it exhausts CPU.
org.gradle.workers.max=4

# --- Build performance ------------------------------------------------------
org.gradle.daemon=true
org.gradle.parallel=false

# Re-enable once C: has healthy free space (>20 GB). The build cache writes
# entries for every transform; when the disk is full, a failed cache write is
# escalated into a hard "Failed to transform <jar>" build failure rather than a
# warning. Off is the safe default until disk headroom is restored.
org.gradle.caching=false

# Gradle forks a brand-new daemon whenever the requested JVM args differ from a
# running one, and idle daemons linger for 3 hours by default. Editing jvmargs
# (or an IDE sync using different args) therefore piles up multi-GB daemons that
# each hold a reservation against the Windows commit charge. 30 min instead.
org.gradle.daemon.idletimeout=1800000

# --- Android ----------------------------------------------------------------
android.useAndroidX=true
# Jetifier rewrites the bytecode of every dependency on every build. No module
# in this project depends on the legacy com.android.support libraries, so it is
# pure cost. Re-enable only if a dependency reintroduces support-library usage.
android.enableJetifier=false
android.ndkVersion=25.2.9519653

GOOGLE_CLIENT_ID=38878128592-294p9irfsff4qntaiituhpevs4uasb4c.apps.googleusercontent.com
